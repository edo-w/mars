[tools]
bun = "1"
lefthook = "2"

[tasks.di]
description = "Install .NET workspace dependencies"
run = "dotnet restore dev/mars.slnx --packages .cache/nuget --no-http-cache"

[tasks.build]
description = "Build the .NET solution"
depends = ["di"]
run = "dotnet build dev/mars.slnx --no-restore"

[tasks.test]
description = "Test the .NET solution"
depends = ["di"]
run = "dotnet test dev/mars.slnx --no-restore"

[tasks.cover]
description = "Run .NET tests with coverage and generate an HTML report"
run = "pwsh -NoProfile -File scripts/create-coverage-report.ps1"

[tasks.coverv]
description = "Open the HTML coverage report generated by mise cover"
run = "pwsh -NoProfile -Command \"Invoke-Item '{{config_root}}/coverage/index.html'\""

[tasks."cli:build"]
description = "Build the Mars CLI"
depends = ["di"]
run = "dotnet build dev/mars-cli/src/Mars.Cli.csproj --no-restore"

[tasks."cli:build-aot"]
description = "Publish the Mars CLI as a native AOT executable"
depends = ["di"]
run = "dotnet publish dev/mars-cli/src/Mars.Cli.csproj -c Release -o dev/mars-cli/dist/aot --self-contained true --packages .cache/nuget --no-http-cache"

[tasks.mars]
description = "Run the published native Mars CLI"
dir = "{{cwd}}"
output = "interleave"
quiet = true
raw = true
raw_args = true
run = '"{{config_root}}/dev/mars-cli/dist/aot/Mars.Cli.exe"'

[tasks.mars.env]
MARS_HOME = "{{config_root}}/.mars/tmp"

[tasks.wf]
description = "Run Mars workflow commands with the published native CLI"
dir = "{{cwd}}"
output = "interleave"
quiet = true
raw = true
raw_args = true
run = '"{{config_root}}/dev/mars-cli/dist/aot/Mars.Cli.exe" wf'

[tasks.wf.env]
MARS_HOME = "{{config_root}}/.mars/tmp"

[tasks."lsp:build-aot"]
description = "Publish the Windows x64 Mars language server"
depends = ["di"]
run = "dotnet publish dev/mars-lsp/src/Mars.Lsp.csproj -c Release -r win-x64 -o dev/mars-lsp/dist/aot --self-contained true --packages .cache/nuget --no-http-cache"

[tasks."vscode:di"]
description = "Install VS Code extension dependencies"
dir = "dev/mars-vscode"
run = "bun install --frozen-lockfile"

[tasks."vscode:check"]
description = "Check the VS Code extension TypeScript"
dir = "dev/mars-vscode"
depends = ["vscode:di"]
run = "bun run check"

[tasks."vscode:build"]
description = "Build the VS Code extension"
dir = "dev/mars-vscode"
depends = ["vscode:di"]
run = "bun run build"

[tasks."vscode:package"]
description = "Package the Windows x64 VS Code extension and Native AOT server"
depends = ["vscode:check", "vscode:build", "lsp:build-aot"]
run = "pwsh -NoProfile -File scripts/package-mars-vscode.ps1"

[tasks."vscode:test"]
description = "Install and smoke test the packaged VSIX in a workspace-local VS Code"
dir = "dev/mars-vscode"
depends = ["vscode:package"]
run = "bun run test:smoke"

[tasks."vscode:dev"]
description = "Open the packaged VSIX in VS Code for manual testing"
dir = "dev/mars-vscode"
depends = ["vscode:package"]
run = "bun run dev"
