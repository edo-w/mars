name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Restore dependencies
        run: dotnet restore dev/mars.slnx

      - name: Build solution
        run: dotnet build dev/mars.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test dev/mars.slnx --configuration Release --no-build --no-restore
